name: design-quality

on:
  pull_request:
  # The merge queue runs the full suite on what will actually land (the pull request merged onto
  # the tip of main). Selection, where a pull request uses it, only narrows pull-request feedback.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  # To list a pull request's changed files (scripts/ci/reach.mjs).
  pull-requests: read

# One run per ref at a time; a new commit on a pull request cancels the run for the old one. A run
# on `main` or in the merge queue is finishing something nobody is about to supersede.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node's http client does not read HTTPS_PROXY by itself; harmless on GitHub runners.
  NODE_USE_ENV_PROXY: '1'
  NEXT_TELEMETRY_DISABLED: '1'

# Every job runs side by side. Each has a budget (`timeout-minutes`): a job that outgrows it fails,
# so CI getting slower is a red build rather than something noticed a month later.
jobs:
  static:
    name: lint · typecheck · design gates
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup

      # bun's typechecker: the same errors as tsc (compared on eleven planted mistakes, identical
      # codes and lines), in under 2 s against tsc's 31 s median here.
      - name: Typecheck (bun check)
        run: npm run -s typecheck

      # oxlint with the ESLint configuration carried over rule for rule (.oxlintrc.json): under 1 s
      # against ESLint's 30 s median. It reported all 35 of 35 planted violations that ESLint did.
      - name: Lint (oxlint)
        run: npx oxlint --format=github

      - name: Lint DESIGN.md (Google design.md spec + WCAG contrast)
        run: npm run design:lint

      - name: Check DESIGN.md exports cleanly to Tailwind v4 @theme
        run: npm run design:export:tailwind > /dev/null

      # impeccable only ADVISES when a size, colour or radius is off the DESIGN.md scale, and an
      # advisory never changes its exit code: fifteen off-ramp font sizes accumulated with this step
      # green, one of them 15px text under the 17px floor. check-design-drift.mjs fails on those too.
      - name: impeccable detect (anti-slop rules + DESIGN.md scale drift over src/)
        run: node scripts/check-design-drift.mjs src/

      - name: stylelint
        run: npm run lint:css

      # Level 17. `wedding-site-standards` asks 44px of a link that is the whole of its paragraph.
      # This reads the source rather than the page because the links that got missed sit behind
      # `venue.block.url` and `h.bookingUrl`, which no fixture renders. It also runs inside
      # `npm run test:unit`, so it cannot become a gate that exists only in a workflow file.
      - name: Every paragraph-only link carries a 44px target
        run: npm run -s targets:check

      # Level 15. stylelint matches literal `font-family` values and cannot see through an
      # indirection that resolves to one: `ops.css` referenced `var(--font-sans)`, defined nowhere,
      # and the whole admin console rendered in Roboto / Helvetica Neue / Arial with every check
      # green. This compares references against definitions. Also inside `npm run test:unit`.
      - name: Every var(--token) a component references is defined
        run: node scripts/check-css-vars.mjs

      # Level 17. Every path a living document points at exists; `.env.example` documents every
      # variable the app reads, exactly once; the activation matrix is regenerated from `flags.ts`.
      - name: Documentation references resolve · .env.example complete · activation matrix current
        run: npm run docs:check

      - name: Every vitest project runs in CI
        run: node scripts/check-vitest-coverage.mjs

      - name: Every spec runs in exactly one arrangement
        run: node scripts/check-spec-coverage.mjs

      - name: Migrations are committed and current
        run: |
          npm run db:generate
          git diff --exit-code -- src/db/migrations || { echo "::error::run npm run db:generate and commit the result"; exit 1; }

      # The one place bun's download cache is saved, and only from main: every other job and every
      # pull request restores it (.github/actions/setup).
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

  unit:
    name: unit · ui · stage tests · concierge evals
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup

      - name: Unit tests (vitest)
        run: npm run test:unit

      # The concierge eval gate: 26 questions through the real pipeline against the deterministic
      # mock model, scored on grounding, tool selection, refusal correctness and authorization
      # violations. scripts/check-vitest-coverage.mjs (the static job) fails if this line goes.
      - name: Concierge evals (vitest, deterministic mock model)
        run: npm run test:evals

  integration:
    name: integration ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # On a pull request, with selection on, a suite none of the changed files can reach is skipped
      # here; the merge queue and main always run it (scripts/ci/reach.mjs, scripts/ci/affected.mjs).
      - name: Can this change reach the integration suite?
        id: reach
        run: node scripts/ci/reach.mjs integration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_SELECTION: ${{ vars.CI_SELECTION }}
      - uses: ./.github/actions/setup
        if: steps.reach.outputs.run == 'true'

      # Four shards of about equal recorded time (scripts/ci/vitest-plan.mjs). In one job the 83
      # files took 3.8 minutes at the median, the longest step outside Playwright.
      - name: Integration tests (vitest + PGlite), shard ${{ matrix.shard }} of 4
        if: steps.reach.outputs.run == 'true'
        run: npm run test:integration -- --reporter=default --reporter=json --outputFile.json=test-results/integration-${{ matrix.shard }}.json $(node scripts/ci/vitest-plan.mjs integration ${{ matrix.shard }}/4)

      # Each file's time, for `npm run test:durations`, which the shard plan is built from.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.reach.outputs.run == 'true'
        with:
          name: integration-${{ matrix.shard }}
          path: test-results/integration-${{ matrix.shard }}.json
          retention-days: 7

  e2e:
    name: e2e ${{ matrix.kind }} ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: production, shard: 1, of: 2 }
          - { kind: production, shard: 2, of: 2 }
          - { kind: test-server, shard: 1, of: 12 }
          - { kind: test-server, shard: 2, of: 12 }
          - { kind: test-server, shard: 3, of: 12 }
          - { kind: test-server, shard: 4, of: 12 }
          - { kind: test-server, shard: 5, of: 12 }
          - { kind: test-server, shard: 6, of: 12 }
          - { kind: test-server, shard: 7, of: 12 }
          - { kind: test-server, shard: 8, of: 12 }
          - { kind: test-server, shard: 9, of: 12 }
          - { kind: test-server, shard: 10, of: 12 }
          - { kind: test-server, shard: 11, of: 12 }
          - { kind: test-server, shard: 12, of: 12 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # On a pull request, with selection on, a suite none of the changed files can reach is skipped
      # here; the merge queue and main always run it (scripts/ci/reach.mjs, scripts/ci/affected.mjs).
      - name: Can this change reach the e2e suite?
        id: reach
        run: node scripts/ci/reach.mjs e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_SELECTION: ${{ vars.CI_SELECTION }}
      - uses: ./.github/actions/setup
        if: steps.reach.outputs.run == 'true'

      # The key is the resolved Playwright version, so a version bump misses once. Headless shell
      # only: the specs never open a headed browser, and it is a third of the download.
      - name: Playwright version
        if: steps.reach.outputs.run == 'true'
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.reach.outputs.run == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: pw-shell-${{ runner.os }}-${{ steps.pw.outputs.v }}
      # No `--with-deps`: the runner image already has Chromium's libraries, and installing them
      # again from Ubuntu's mirrors took 12 s at the median and 25 at p95 in every job.
      - run: npx playwright install chromium --only-shell
        if: steps.reach.outputs.run == 'true'

      # Turbopack's build cache, seeded by main (the `build-cache` job) and only restored here.
      # With it the compile is a few seconds instead of half a minute.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.reach.outputs.run == 'true'
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      # Each shard builds for itself: with the cache that is quicker than waiting for a build job
      # and downloading its 480 MB. The typecheck `next build` repeats is the `static` job's.
      - name: Build
        if: steps.reach.outputs.run == 'true'
        run: npm run build
        env:
          PGLITE_MEMORY: '1'
          BUILD_SKIP_TYPECHECK: '1'

      - name: Production-build specs against `next start`
        if: steps.reach.outputs.run == 'true' && matrix.kind == 'production'
        # These assert production behaviour, including the proxy's `private, no-store` on
        # cookie-resolved public URLs. Phone and desktop are the review viewports.
        run: node scripts/ci/e2e-shard.mjs production ${{ matrix.shard }}/${{ matrix.of }}
        env:
          CI: 'true'
          PW_WEB_SERVER_COMMAND: npm run start
          PGLITE_MEMORY: '1'
          DB_AUTO_MIGRATE: '1'
          DB_AUTO_SEED: '1'
          LOG_FORMAT: json
          # CI-only placeholders so the production env check passes; never real secrets.
          CONFIRMATION_SECRET: ci-only-confirmation-secret-not-real
          CRON_SECRET: ci-only-cron-secret-not-real-32-chars-minimum
          STORAGE_SIGNING_SECRET: ci-only-storage-signing-secret-not-real
          HEALTH_TOKEN: ci-only-health-token-not-real
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-real
          BETTER_AUTH_URL: http://localhost:3000
          RESEND_API_KEY: ci-only-resend-key-not-real
          EMAIL_FROM: Sara + Tyler <ci@example.invalid>
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # A production build refuses per-process rate-limit buckets; use the DB backend.
          RATE_LIMIT_BACKEND: db
          TRUSTED_PROXY_HOPS: '1'

      - name: Identity, RSVP and security specs against a NODE_ENV=test server
        if: steps.reach.outputs.run == 'true' && matrix.kind == 'test-server'
        # Two things exist only on this server, and both are deliberate:
        #   * the dev inbox and fixtures route, refused outright under NODE_ENV=production
        #     (security review S5); on a hosted runner they also require the DEV_INBOX_TOKEN
        #     bearer, set on the server and on the test runner alike;
        #   * the test-principal injector, which needs NODE_ENV=test exactly.
        # The shard runner hands this shard's tests to scripts/test-server-specs.mjs, which starts
        # `next start` on the build above with the test settings, runs them, and stops the server.
        # That is the same script a developer runs (`npm run test:e2e:server`), so the server
        # settings cannot drift.
        run: node scripts/ci/e2e-shard.mjs test-server ${{ matrix.shard }}/${{ matrix.of }}
        env:
          CI: 'true'
          PORT: '3000'

      # The JSON report carries each test's time; `npm run e2e:durations` turns a run's reports
      # into tests/e2e/durations.json, which the shard plan reads. The HTML report rides along.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.reach.outputs.run == 'true'
        with:
          name: playwright-${{ matrix.kind }}-${{ matrix.shard }}
          path: |
            playwright-report
            test-results/report.json
          retention-days: 7

  build-cache:
    name: seed the build cache (main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - run: npm run build
        env:
          PGLITE_MEMORY: '1'

  a11y:
    name: axe-core accessibility against a deployed preview (BASE_URL)
    # Runs only when a repository variable BASE_URL (e.g. a preview deployment) is configured.
    if: ${{ vars.BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: npx playwright install chromium --only-shell
      - run: npx playwright test tests/a11y.spec.ts
        env:
          BASE_URL: ${{ vars.BASE_URL }}

  # One check to require in branch protection and the merge queue, whatever the shards are called.
  ci:
    name: CI
    if: always()
    needs: [static, unit, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
