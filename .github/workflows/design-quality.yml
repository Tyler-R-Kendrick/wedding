name: design-quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Node's http client does not read HTTPS_PROXY by itself; harmless on GitHub runners.
  NODE_USE_ENV_PROXY: '1'

jobs:
  quality:
    name: DESIGN.md lint · anti-slop detect · stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint DESIGN.md (Google design.md spec + WCAG contrast)
        run: npm run design:lint

      - name: Check DESIGN.md exports cleanly to Tailwind v4 @theme
        run: npm run design:export:tailwind > /dev/null

      - name: impeccable detect (deterministic anti-slop rules over src/, the version in package-lock)
        run: npx --no-install impeccable detect src/

      - name: stylelint
        run: npm run lint:css

  verify:
    name: typecheck · lint · unit · integration · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Integration tests (vitest + PGlite)
        run: npm run test:integration

      - name: Migrations are committed and current
        run: |
          npm run db:generate
          git diff --exit-code -- src/db/migrations || { echo "::error::run npm run db:generate and commit the result"; exit 1; }

      - name: Build (Next.js)
        run: npm run build
        env:
          PGLITE_MEMORY: '1'

  e2e:
    name: Playwright smoke (production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          PGLITE_MEMORY: '1'

      - name: Every spec runs in exactly one arrangement
        run: node scripts/check-spec-coverage.mjs

      - name: Production-build specs against `next start`
        # These assert production behaviour, including the proxy's `private, no-store` on
        # cookie-resolved public URLs — `next dev` replaces that header, so they only mean
        # anything here. The list lives in scripts/check-spec-coverage.mjs, which fails the
        # build if a spec belongs to neither step.
        run: npx playwright test $(node -e "import('./scripts/check-spec-coverage.mjs').then(m => console.log(m.PRODUCTION_SPECS.join(' ')))")
        env:
          CI: 'true'
          PW_WEB_SERVER_COMMAND: npm run start
          PGLITE_MEMORY: '1'
          DB_AUTO_MIGRATE: '1'
          DB_AUTO_SEED: '1'
          LOG_FORMAT: json
          # CI-only placeholders so the production env check passes; never real secrets.
          CONFIRMATION_SECRET: ci-only-confirmation-secret-not-real
          CRON_SECRET: ci-only-cron-secret-not-real-32-chars-minimum
          STORAGE_SIGNING_SECRET: ci-only-storage-signing-secret-not-real
          HEALTH_TOKEN: ci-only-health-token-not-real
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-real
          BETTER_AUTH_URL: http://localhost:3000
          RESEND_API_KEY: ci-only-resend-key-not-real
          EMAIL_FROM: Sara + Tyler <ci@example.invalid>
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # A production build refuses per-process rate-limit buckets; use the DB backend.
          RATE_LIMIT_BACKEND: db
          TRUSTED_PROXY_HOPS: '1'

      - name: Identity, RSVP and security specs against a NODE_ENV=test server
        # Two things exist only here, and both are deliberate:
        #   * the dev inbox and fixtures route — refused outright under NODE_ENV=production
        #     (security review S5), and on any hosted runner (CI/VERCEL) they additionally
        #     require the DEV_INBOX_TOKEN bearer, which must be set on the SERVER as well as
        #     on the test runner;
        #   * the test-principal injector, which needs NODE_ENV=test exactly.
        # tests/security/** never ran in CI before this step existed, which is how a
        # cross-origin sign-out reached main with a passing suite asserting it was blocked.
        run: |
          npm run dev -- -p 3000 > "$RUNNER_TEMP/test-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null "http://localhost:3000/api/health" && break
            sleep 2
          done
          curl -fsS -o /dev/null "http://localhost:3000/api/health" \
            || { echo "::error::test server did not become ready"; cat "$RUNNER_TEMP/test-server.log"; exit 1; }
          # A dev server compiles each route on first request; warm the journeys' routes so a cold
          # compile cannot outlast a navigation timeout.
          for path in / /sign-in /claim /claim/verify /claim/welcome /claim/passkey /step-up /rsvp \
                      /your-weekend /invite/warmup-token-0000000000000000000000 /api/dev/inbox; do
            curl -s -o /dev/null -m 120 "http://localhost:3000$path" || true
          done
          npx playwright test $(node -e "import('./scripts/check-spec-coverage.mjs').then(m => console.log(m.TEST_SERVER_SPECS.join(' ')))")
        env:
          CI: 'true'
          NODE_ENV: test
          # Playwright treats the server above as external and does not start its own.
          BASE_URL: http://localhost:3000
          SEED_TEST_FIXTURES: '1'
          # CI-only placeholders. The dev bearer opens the dev routes on this runner only, and the
          # test-auth secret enables the principal injector; both are refused on a production host.
          DEV_INBOX_TOKEN: ci-only-dev-inbox-token-not-real
          TEST_AUTH_SECRET: ci-only-test-auth-secret-not-real
          # Level 10: the upload journey interrupts a MULTIPART part-2 PUT to prove resume works.
          # Its largest fixture is ~4 MB, so at the 8 MB default nothing is multipart, the route
          # interception never fires and the spec fails asserting 2 interruptions and seeing 0. A
          # 1 MiB part size makes the fixture ~5 parts, which is the shape the journey is about.
          MEDIA_PART_SIZE_MB: '1'
          MEDIA_MULTIPART_THRESHOLD_MB: '1'
          PGLITE_MEMORY: '1'
          DB_AUTO_MIGRATE: '1'
          DB_AUTO_SEED: '1'
          LOG_FORMAT: json
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          CONFIRMATION_SECRET: ci-only-confirmation-secret-not-real
          CRON_SECRET: ci-only-cron-secret-not-real-32-chars-minimum
          STORAGE_SIGNING_SECRET: ci-only-storage-signing-secret-not-real
          HEALTH_TOKEN: ci-only-health-token-not-real
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-real
          BETTER_AUTH_URL: http://localhost:3000
          TRUSTED_PROXY_HOPS: '1'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  a11y:
    name: axe-core accessibility against a deployed preview (BASE_URL)
    # Runs only when a repository variable BASE_URL (e.g. a preview deployment) is configured.
    if: ${{ vars.BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/a11y.spec.ts
        env:
          BASE_URL: ${{ vars.BASE_URL }}
