name: design-quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref at a time. Without this every push starts a fresh set of four jobs while the
# superseded ones keep running to completion — six pushes to one branch in a morning meant six
# concurrent Playwright jobs, each holding a runner for eleven minutes. Only pull requests cancel:
# a run on `main` is finishing something nobody is about to supersede, and is left alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node's http client does not read HTTPS_PROXY by itself; harmless on GitHub runners.
  NODE_USE_ENV_PROXY: '1'

jobs:
  quality:
    name: DESIGN.md lint · anti-slop detect · stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint DESIGN.md (Google design.md spec + WCAG contrast)
        run: npm run design:lint

      - name: Check DESIGN.md exports cleanly to Tailwind v4 @theme
        run: npm run design:export:tailwind > /dev/null

      - name: impeccable detect (deterministic anti-slop rules over src/, the version in package-lock)
        run: npx --no-install impeccable detect src/

      - name: stylelint
        run: npm run lint:css

      # Level 15. stylelint matches literal `font-family` values and cannot see through an
      # indirection that resolves to one: `ops.css` referenced `var(--font-sans)`, defined nowhere,
      # and the whole admin console rendered in Roboto / Helvetica Neue / Arial with every check in
      # this job green. This compares references against definitions, which nothing else here does.
      # It also runs inside `npm run test:unit` (tests/unit/css-vars.test.ts) so it cannot be a gate
      # that exists only in a workflow file.
      - name: Every var(--token) a component references is defined
        run: node scripts/check-css-vars.mjs

  verify:
    name: typecheck · lint · unit · integration · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Integration tests (vitest + PGlite)
        run: npm run test:integration

      # The concierge eval gate: 26 questions through the real pipeline against the deterministic
      # mock model, scored on grounding, tool selection, refusal correctness and authorization
      # violations. It is inside `npm run verify`, but this job runs the vitest projects one by one
      # and never calls `verify` — so without this line the gate ran on a developer's machine and
      # nowhere else. Same defect class as a Playwright spec belonging to no arrangement, which is
      # what `scripts/check-spec-coverage.mjs` exists to stop; the step below now stops this one.
      - name: Concierge evals (vitest, deterministic mock model)
        run: npm run test:evals

      - name: Every vitest project runs in CI
        run: node scripts/check-vitest-coverage.mjs

      - name: Migrations are committed and current
        run: |
          npm run db:generate
          git diff --exit-code -- src/db/migrations || { echo "::error::run npm run db:generate and commit the result"; exit 1; }

      - name: Build (Next.js)
        run: npm run build
        env:
          PGLITE_MEMORY: '1'

  e2e:
    name: Playwright smoke (production build)
    runs-on: ubuntu-latest
    # One of these at a time in the whole repository, queued rather than cancelled.
    #
    # This job is the heaviest thing here — a production build, `next start`, then a `next dev`
    # server with two Playwright workers against it — and it is the only one that has ever died
    # with "the runner has received a shutdown signal". Five runs on this branch today say when:
    #
    #   11:44–11:55  no run on main   green
    #   11:56–12:07  no run on main   green
    #   12:11–12:18  #20 on main      shutdown signal, 30s into the dev-server step
    #   12:37–12:50  #22 on main      superseded
    #   12:45–12:57  #23 on main      shutdown signal, 30s into the dev-server step
    #
    # Both deaths took THIS job while its siblings on the same run finished green seconds later,
    # so it is not the run being cancelled and not the account losing its runners — it is this
    # job's own machine going away while another copy of it runs elsewhere in the repo.
    #
    # Scoped to the job, not the workflow, so lint and typecheck stay parallel and only the
    # expensive one takes a turn. `cancel-in-progress: false` because a queued run is the point;
    # GitHub keeps one running and one pending per group and drops older pending ones itself,
    # so a burst of pushes still collapses to the newest.
    concurrency:
      group: playwright-smoke-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Every run was downloading Chrome for Testing (184 MiB), chrome-headless-shell (115 MiB)
      # and ffmpeg from scratch. The key is the resolved Playwright version, so a version bump
      # misses the cache and re-downloads exactly once.
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ runner.os }}-${{ steps.pw.outputs.v }}

      # `--with-deps` installs system libraries, which the cache cannot hold, so it always runs;
      # the browser download itself is what the cache skips.
      - run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          PGLITE_MEMORY: '1'

      - name: Every spec runs in exactly one arrangement
        run: node scripts/check-spec-coverage.mjs

      # The Secret Drop page as it is actually PUBLISHED — no server behind it, no Claude session
      # watching. Every other check of that page runs it against `secrets:serve`, which has a
      # worker, so all of them stayed green while the published artifact queued work nothing could
      # ever claim. This one needs only the built page and the Chromium this job already installs.
      - name: The published Secret Drop offers no control that cannot finish
        run: |
          node scripts/secrets/build-page.mjs
          node scripts/secrets/page/verify-artifact.mjs

      - name: Production-build specs against `next start`
        # These assert production behaviour, including the proxy's `private, no-store` on
        # cookie-resolved public URLs — `next dev` replaces that header, so they only mean
        # anything here. The list lives in scripts/check-spec-coverage.mjs, which fails the
        # build if a spec belongs to neither step.
        run: npx playwright test $(node -e "import('./scripts/check-spec-coverage.mjs').then(m => console.log(m.PRODUCTION_SPECS.join(' ')))")
        env:
          CI: 'true'
          PW_WEB_SERVER_COMMAND: npm run start
          PGLITE_MEMORY: '1'
          DB_AUTO_MIGRATE: '1'
          DB_AUTO_SEED: '1'
          LOG_FORMAT: json
          # CI-only placeholders so the production env check passes; never real secrets.
          CONFIRMATION_SECRET: ci-only-confirmation-secret-not-real
          CRON_SECRET: ci-only-cron-secret-not-real-32-chars-minimum
          STORAGE_SIGNING_SECRET: ci-only-storage-signing-secret-not-real
          HEALTH_TOKEN: ci-only-health-token-not-real
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-real
          BETTER_AUTH_URL: http://localhost:3000
          RESEND_API_KEY: ci-only-resend-key-not-real
          EMAIL_FROM: Sara + Tyler <ci@example.invalid>
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # A production build refuses per-process rate-limit buckets; use the DB backend.
          RATE_LIMIT_BACKEND: db
          TRUSTED_PROXY_HOPS: '1'

      - name: Identity, RSVP and security specs against a NODE_ENV=test server
        # Two things exist only here, and both are deliberate:
        #   * the dev inbox and fixtures route — refused outright under NODE_ENV=production
        #     (security review S5), and on any hosted runner (CI/VERCEL) they additionally
        #     require the DEV_INBOX_TOKEN bearer, which must be set on the SERVER as well as
        #     on the test runner;
        #   * the test-principal injector, which needs NODE_ENV=test exactly.
        # tests/security/** never ran in CI before this step existed, which is how a
        # cross-origin sign-out reached main with a passing suite asserting it was blocked.
        run: |
          npm run dev -- -p 3000 > "$RUNNER_TEMP/test-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null "http://localhost:3000/api/health" && break
            sleep 2
          done
          curl -fsS -o /dev/null "http://localhost:3000/api/health" \
            || { echo "::error::test server did not become ready"; cat "$RUNNER_TEMP/test-server.log"; exit 1; }
          # A dev server compiles each route on first request; warm the journeys' routes so a cold
          # compile cannot outlast a navigation timeout.
          # /admin and the media surfaces were absent from this list until level 11, when this step
          # failed on `signInViaUi(admin)`: Continue clicked, then a 5s wait for /admin that ended
          # with the page still on /claim/verify — on the run AND its retry — while a concurrent
          # request in another spec hit a 30s test timeout. Both are the shape of a server busy
          # compiling, and /admin had never been requested; the level-11 journeys added load to the
          # same dev server. That is the diagnosis, not a proof: it was not reproducible locally,
          # where the suite passes either way. Adding the routes costs a few seconds and is what
          # this list is for, so it is the first thing to try; if the step fails again the next
          # suspect is worker contention rather than cold compiles.
          #
          # Level 14 turned that diagnosis into proof. `admin-console.spec.ts` walks EVERY href in
          # the console index — 21 admin routes — and the step failed with
          # `page.goto: net::ERR_ABORTED at /admin/rsvp` and, on retry, `/admin/content`: two routes
          # this list did not have. Level 14 had added only its own six. Those cold compiles also
          # starved the specs running beside them, which is why claim.spec and otp.spec — untouched
          # by that level and green before it — began timing out on the same runner. The failing
          # navigations name the unwarmed routes by URL, so this is no longer inference.
          #
          # EVERY admin route belongs here now, not just the ones a level happens to add: the walk
          # visits all of them by construction, so a screen added without a line here re-creates the
          # failure. The walk asserts `hrefs.length >= 20`, which is the tripwire.
          #
          # That tripwire has a blind spot, and it cost a run at level 16. The walk enumerates
          # `#main .con-index a` — so it only covers routes reachable as a LINK from the console
          # index. A `route.ts` export endpoint is never a link there, and neither are the media
          # sub-pages, so `/admin/guests/export` stayed cold while `/admin/guests` beside it was
          # warm. `idor.spec.ts` hit it and blew its 30s test budget compiling; on the retry the
          # same contention took out a 5s `toHaveURL` in `claimViaUi`, two specs away. Measured
          # locally against this same server: that test takes 26s cold and 5s warm.
          #
          # So when adding a route here, read `src/app`, not the console index — the walk cannot
          # see what is not a link.
          #
          # Guest routes have the same blind spot, and the level-16 run showed it: with the admin
          # exports warmed, `claim.spec.ts` went flaky on `page.goto('/sign-out')` — 30s test
          # budget gone, then green on the retry. Six guest pages the specs navigate to were
          # missing here. The list below is now every path any spec calls `page.goto` on, which is
          # a rule that can be re-derived rather than remembered:
          #   comm -23 <(grep -rhoE "page\.goto\(\s*'/[a-z0-9/_-]*'" tests/ | grep -oE "/[a-z0-9/_-]*" | sort -u) <this list>
          for path in / /sign-in /sign-in/admin /admin /claim /claim/verify /claim/welcome /claim/passkey /step-up /rsvp \
                      /your-weekend /trip /transportation /gifts /photos /photos/guest-uploads \
                      /media/upload /media/mine /media/search /media/me /admin/ai /admin/biometrics \
                      /admin/lifecycle /admin/audit /admin/jobs /admin/metrics /admin/providers /admin/flags \
                      /admin/concierge /admin/content /admin/events /admin/gifts /admin/guests \
                      /admin/households /admin/invitations /admin/media /admin/reservations /admin/rsvp \
                      /admin/seating /admin/transport /admin/travel \
                      /admin/guests/export /admin/rsvp/export \
                      /admin/media/duplicates /admin/media/import /admin/media/metrics \
                      /ask-us /our-story /the-wedding /explore-caa /share-an-adventure /sign-out \
                      /invite/warmup-token-0000000000000000000000 /api/dev/inbox; do
            curl -s -o /dev/null -m 120 "http://localhost:3000$path" || true
          done
          npx playwright test $(node -e "import('./scripts/check-spec-coverage.mjs').then(m => console.log(m.TEST_SERVER_SPECS.join(' ')))")
        env:
          CI: 'true'
          NODE_ENV: test
          # Playwright treats the server above as external and does not start its own.
          BASE_URL: http://localhost:3000
          SEED_TEST_FIXTURES: '1'
          # CI-only placeholders. The dev bearer opens the dev routes on this runner only, and the
          # test-auth secret enables the principal injector; both are refused on a production host.
          DEV_INBOX_TOKEN: ci-only-dev-inbox-token-not-real
          TEST_AUTH_SECRET: ci-only-test-auth-secret-not-real
          # Level 10: the upload journey interrupts a MULTIPART part-2 PUT to prove resume works.
          # Its largest fixture is ~4 MB, so at the 8 MB default nothing is multipart, the route
          # interception never fires and the spec fails asserting 2 interruptions and seeing 0. A
          # 1 MiB part size makes the fixture ~5 parts, which is the shape the journey is about.
          MEDIA_PART_SIZE_MB: '1'
          MEDIA_MULTIPART_THRESHOLD_MB: '1'
          PGLITE_MEMORY: '1'
          DB_AUTO_MIGRATE: '1'
          DB_AUTO_SEED: '1'
          LOG_FORMAT: json
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          CONFIRMATION_SECRET: ci-only-confirmation-secret-not-real
          CRON_SECRET: ci-only-cron-secret-not-real-32-chars-minimum
          STORAGE_SIGNING_SECRET: ci-only-storage-signing-secret-not-real
          HEALTH_TOKEN: ci-only-health-token-not-real
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-real
          BETTER_AUTH_URL: http://localhost:3000
          TRUSTED_PROXY_HOPS: '1'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  a11y:
    name: axe-core accessibility against a deployed preview (BASE_URL)
    # Runs only when a repository variable BASE_URL (e.g. a preview deployment) is configured.
    if: ${{ vars.BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/a11y.spec.ts
        env:
          BASE_URL: ${{ vars.BASE_URL }}
