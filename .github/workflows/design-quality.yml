name: design-quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref at a time. Without this every push starts a fresh set of four jobs while the
# superseded ones keep running to completion — six pushes to one branch in a morning meant six
# concurrent Playwright jobs, each holding a runner for eleven minutes. Only pull requests cancel:
# a run on `main` is finishing something nobody is about to supersede, and is left alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node's http client does not read HTTPS_PROXY by itself; harmless on GitHub runners.
  NODE_USE_ENV_PROXY: '1'

jobs:
  quality:
    name: DESIGN.md lint · anti-slop detect · stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint DESIGN.md (Google design.md spec + WCAG contrast)
        run: npm run design:lint

      - name: Check DESIGN.md exports cleanly to Tailwind v4 @theme
        run: npm run design:export:tailwind > /dev/null

      # impeccable only ADVISES when a size, colour or radius is off the DESIGN.md scale, and an
      # advisory never changes its exit code: fifteen off-ramp font sizes accumulated with this step
      # green, one of them 15px text under the 17px floor. check-design-drift.mjs fails on those too.
      - name: impeccable detect (anti-slop rules + DESIGN.md scale drift over src/, the version in package-lock)
        run: node scripts/check-design-drift.mjs src/

      - name: stylelint
        run: npm run lint:css

      # Level 17. `wedding-site-standards` asks 44px of a link that is the whole of its paragraph,
      # and two mechanisms carried that rule — a call-site `standalone` prop and a hand-maintained
      # selector list — either of which a call site could forget. Six did in one commit. This is a
      # check, so forgetting is a red build; it reads the source rather than the page because the
      # links that got missed sit behind `venue.block.url` and `h.bookingUrl`, which no fixture
      # renders. Like check-css-vars above it also runs inside `npm run test:unit`, so it cannot
      # become a gate that exists only in a workflow file.
      - name: Every paragraph-only link carries a 44px target
        run: npm run -s targets:check

      # Level 15. stylelint matches literal `font-family` values and cannot see through an
      # indirection that resolves to one: `ops.css` referenced `var(--font-sans)`, defined nowhere,
      # and the whole admin console rendered in Roboto / Helvetica Neue / Arial with every check in
      # this job green. This compares references against definitions, which nothing else here does.
      # It also runs inside `npm run test:unit` (tests/unit/css-vars.test.ts) so it cannot be a gate
      # that exists only in a workflow file.
      - name: Every var(--token) a component references is defined
        run: node scripts/check-css-vars.mjs

      # Level 16. The other half of the same hole: a token that IS defined and resolves to the wrong
      # design. `globals.css` imports the DEFAULT design's Tailwind `@theme` block unscoped, so a
      # shared component reading `--text-h3` gets Gilded Hour's number under Conservatory too — and
      # every check above stays green, because the reference resolves. An independent review found
      # two of these by measuring two elements; there were 21. Also in `npm run test:unit`
      # (tests/unit/theme-tokens.test.ts) so it is not a gate that lives only in a workflow file.
      - name: No shared component reads a token only one design declares
        run: node scripts/check-theme-tokens.mjs

      # Level 17. Documentation is the one artifact here with no compiler behind it, and this run
      # kept finding pages that described a version of the site that no longer existed. Three
      # mechanical guarantees, so the same class cannot come back through the docs:
      #   * every path a living document points at exists (vendored skills and dated records of a
      #     moment — reviews, critiques — are out of scope, and the script says why);
      #   * `.env.example` documents every variable the app reads, exactly once, and nothing dead;
      #   * the activation matrix is regenerated from `flags.ts` and the provider registry, so an
      #     operator's table of what is switched off cannot drift from the code that switches it.
      - name: Documentation references resolve · .env.example complete · activation matrix current
        run: npm run docs:check

  verify:
    name: typecheck · lint · unit · integration · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Integration tests (vitest + PGlite)
        run: npm run test:integration

      # The concierge eval gate: 26 questions through the real pipeline against the deterministic
      # mock model, scored on grounding, tool selection, refusal correctness and authorization
      # violations. It is inside `npm run verify`, but this job runs the vitest projects one by one
      # and never calls `verify` — so without this line the gate ran on a developer's machine and
      # nowhere else. Same defect class as a Playwright spec belonging to no arrangement, which is
      # what `scripts/check-spec-coverage.mjs` exists to stop; the step below now stops this one.
      - name: Concierge evals (vitest, deterministic mock model)
        run: npm run test:evals

      - name: Every vitest project runs in CI
        run: node scripts/check-vitest-coverage.mjs

      - name: Migrations are committed and current
        run: |
          npm run db:generate
          git diff --exit-code -- src/db/migrations || { echo "::error::run npm run db:generate and commit the result"; exit 1; }

      - name: Build (Next.js)
        run: npm run build
        env:
          PGLITE_MEMORY: '1'

  e2e:
    name: Playwright smoke (production build)
    runs-on: ubuntu-latest
    # No job-level concurrency group: the workflow's own group (one run per ref, superseded pushes
    # to a pull request cancelled) is the only one this job needs.
    #
    # It used to share ONE group across the whole repository, to keep two copies from running at
    # once after two runs on main died with "the runner has received a shutdown signal". The
    # swap step below found the cause: `next dev` warming every route runs a 16 GB runner out of
    # memory, with or without another run in the repository. The group stayed, and it cost more
    # than it saved. GitHub keeps one running and ONE pending job per group and cancels an older
    # pending one when another arrives, so with a few pull requests open a PR's Playwright job was
    # cancelled before it ever got a runner (#56's run 36287088103: queued 01:57, dropped 02:01
    # when #57 queued) and its check read "cancelled" on a commit nothing had tested.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Every run was downloading Chrome for Testing (184 MiB), chrome-headless-shell (115 MiB)
      # and ffmpeg from scratch. The key is the resolved Playwright version, so a version bump
      # misses the cache and re-downloads exactly once.
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-browsers-${{ runner.os }}-${{ steps.pw.outputs.v }}

      # `--with-deps` installs system libraries, which the cache cannot hold, so it always runs;
      # the browser download itself is what the cache skips.
      - run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          PGLITE_MEMORY: '1'

      - name: Every spec runs in exactly one arrangement
        run: node scripts/check-spec-coverage.mjs

      - name: Production-build specs against `next start`
        # These assert production behaviour, including the proxy's `private, no-store` on
        # cookie-resolved public URLs — `next dev` replaces that header, so they only mean
        # anything here. The list lives in scripts/check-spec-coverage.mjs, which fails the
        # build if a spec belongs to neither step.
        # Phone and desktop are the review viewports (several specs already skip the tablet
        # profile for that reason); running every spec a third time bought a third more minutes
        # and no findings.
        run: npx playwright test --project=mobile --project=desktop $(node -e "import('./scripts/check-spec-coverage.mjs').then(m => console.log(m.PRODUCTION_SPECS.join(' ')))")
        env:
          CI: 'true'
          PW_WEB_SERVER_COMMAND: npm run start
          PGLITE_MEMORY: '1'
          DB_AUTO_MIGRATE: '1'
          DB_AUTO_SEED: '1'
          LOG_FORMAT: json
          # CI-only placeholders so the production env check passes; never real secrets.
          CONFIRMATION_SECRET: ci-only-confirmation-secret-not-real
          CRON_SECRET: ci-only-cron-secret-not-real-32-chars-minimum
          STORAGE_SIGNING_SECRET: ci-only-storage-signing-secret-not-real
          HEALTH_TOKEN: ci-only-health-token-not-real
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-real
          BETTER_AUTH_URL: http://localhost:3000
          RESEND_API_KEY: ci-only-resend-key-not-real
          EMAIL_FROM: Sara + Tyler <ci@example.invalid>
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # A production build refuses per-process rate-limit buckets; use the DB backend.
          RATE_LIMIT_BACKEND: db
          TRUSTED_PROXY_HOPS: '1'

      - name: Swap, as a cushion for the dev server over a long run
        # The warm-up no longer needs this (see the next step). What still grows is the dev
        # server's own JavaScript heap: over the three-project run it climbs from about 0.6 GB to
        # several GB, and with the compiler's share and three browsers beside it a 16 GB runner has
        # little to spare. Out of memory, the kernel takes the runner agent ("the runner has
        # received a shutdown signal"). Production does not do this: `next start` holds about
        # 225 MB of heap across 3,000 requests. Until the dev server's growth is understood, the
        # swap file stays; it costs a few seconds and is only touched if the run needs it.
        run: |
          dir=/mnt
          [ "$(df --output=avail -BG "$dir" | tail -1 | tr -dc 0-9)" -ge 20 ] || dir="$RUNNER_TEMP"
          sudo swapoff -a || true
          sudo fallocate -l 16G "$dir/ci-swapfile"
          sudo chmod 600 "$dir/ci-swapfile"
          sudo mkswap "$dir/ci-swapfile"
          sudo swapon "$dir/ci-swapfile"
          free -m

      - name: Identity, RSVP and security specs against a NODE_ENV=test server
        # Two things exist only on this server, and both are deliberate:
        #   * the dev inbox and fixtures route, refused outright under NODE_ENV=production
        #     (security review S5); on a hosted runner (CI/VERCEL) they also require the
        #     DEV_INBOX_TOKEN bearer, set on the server and on the test runner alike;
        #   * the test-principal injector, which needs NODE_ENV=test exactly.
        # tests/security/** never ran in CI before this step existed, which is how a
        # cross-origin sign-out reached main with a passing suite asserting it was blocked.
        #
        # The script is the whole step: it starts `next dev` with the test settings, warms every
        # route a spec navigates to (WARM_ROUTES, with the reason each is there), runs the
        # TEST_SERVER_SPECS, and stops the server. It is the same command a developer runs
        # (`npm run test:e2e:server`), so the two cannot drift.
        #
        # Warming eighty routes back to back used to take the dev server past 13 GB. Three changes
        # brought that to about 6 GB: the test server builds no source maps and no longer bundles the
        # server libraries (next.config.ts), and the warm-up pauses whenever the server has grown
        # 2.5 GB, which is when Turbopack lets go of what it compiled. The script prints the
        # server's peak for the warm-up and for the whole run.
        run: node scripts/test-server-specs.mjs --project=mobile --project=desktop
        env:
          CI: 'true'
          PORT: '3000'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  a11y:
    name: axe-core accessibility against a deployed preview (BASE_URL)
    # Runs only when a repository variable BASE_URL (e.g. a preview deployment) is configured.
    if: ${{ vars.BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/a11y.spec.ts
        env:
          BASE_URL: ${{ vars.BASE_URL }}
