name: design-quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Node's http client does not read HTTPS_PROXY by itself; harmless on GitHub runners.
  NODE_USE_ENV_PROXY: '1'

jobs:
  quality:
    name: DESIGN.md lint · anti-slop detect · stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint DESIGN.md (Google design.md spec + WCAG contrast)
        run: npm run design:lint

      - name: Check DESIGN.md exports cleanly to Tailwind v4 @theme
        run: npm run design:export:tailwind > /dev/null

      - name: impeccable detect (deterministic anti-slop rules over src/, the version in package-lock)
        run: npx --no-install impeccable detect src/

      - name: stylelint
        run: npm run lint:css

  verify:
    name: typecheck · lint · unit · integration · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Integration tests (vitest + PGlite)
        run: npm run test:integration

      - name: Migrations are committed and current
        run: |
          npm run db:generate
          git diff --exit-code -- src/db/migrations || { echo "::error::run npm run db:generate and commit the result"; exit 1; }

      - name: Build (Next.js)
        run: npm run build
        env:
          PGLITE_MEMORY: '1'

  e2e:
    name: Playwright smoke (production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          PGLITE_MEMORY: '1'

      - name: Smoke tests against `next start`
        # The identity journeys cannot run against a production build: /api/dev/inbox is 404 whenever
        # NODE_ENV=production, whatever the caller presents (security review S5), and the claim spec
        # reads one-time codes from it. They run against a dev server in the next step.
        run: npx playwright test tests/e2e --grep-invert "claim journey"
        env:
          CI: 'true'
          PW_WEB_SERVER_COMMAND: npm run start
          PGLITE_MEMORY: '1'
          DB_AUTO_MIGRATE: '1'
          DB_AUTO_SEED: '1'
          LOG_FORMAT: json
          # CI-only placeholders so the production env check passes; never real secrets.
          CONFIRMATION_SECRET: ci-only-confirmation-secret-not-real
          CRON_SECRET: ci-only-cron-secret-not-real-32-chars-minimum
          STORAGE_SIGNING_SECRET: ci-only-storage-signing-secret-not-real
          HEALTH_TOKEN: ci-only-health-token-not-real
          # Level 06 made these production-required so real one-time codes can never reach the
          # in-memory dev inbox. Nothing in this step sends mail; the values are placeholders.
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-real
          BETTER_AUTH_URL: http://localhost:3000
          RESEND_API_KEY: ci-only-resend-key-not-real
          EMAIL_FROM: Sara + Tyler <ci@example.invalid>
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # A production build refuses per-process rate-limit buckets; use the same DB backend
          # production uses, which here is PGlite.
          RATE_LIMIT_BACKEND: db
          TEST_AUTH_SECRET: ci-only-test-auth-secret-not-real
          TRUSTED_PROXY_HOPS: '1'

      - name: Playwright identity journeys (dev server)
        # NODE_ENV=development: the mock mailer and the dev inbox are available here and nowhere else.
        # A dev server compiles each route on first request, which can outlast a navigation timeout
        # even though /api/health already answers. Warm every route the journey walks before running;
        # Playwright's single CI retry is the backstop, not the plan.
        run: |
          for path in / /sign-in /claim /claim/verify /claim/welcome /claim/passkey /step-up \
                      /invite/warmup-token-0000000000000000000000 /api/dev/inbox /api/dev/identity; do
            curl -s -o /dev/null -m 120 "http://localhost:3000$path" || true
          done
          npx playwright test tests/e2e/claim.spec.ts
        env:
          CI: 'true'
          PW_WEB_SERVER_COMMAND: npm run dev
          PGLITE_MEMORY: '1'
          DB_AUTO_MIGRATE: '1'
          DB_AUTO_SEED: '1'
          LOG_FORMAT: json
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          CONFIRMATION_SECRET: ci-only-confirmation-secret-not-real
          CRON_SECRET: ci-only-cron-secret-not-real-32-chars-minimum
          STORAGE_SIGNING_SECRET: ci-only-storage-signing-secret-not-real
          HEALTH_TOKEN: ci-only-health-token-not-real
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-real
          BETTER_AUTH_URL: http://localhost:3000
          TEST_AUTH_SECRET: ci-only-test-auth-secret-not-real
          TRUSTED_PROXY_HOPS: '1'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  a11y:
    name: axe-core accessibility against a deployed preview (BASE_URL)
    # Runs only when a repository variable BASE_URL (e.g. a preview deployment) is configured.
    if: ${{ vars.BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/a11y.spec.ts
        env:
          BASE_URL: ${{ vars.BASE_URL }}
