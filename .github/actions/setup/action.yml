name: Set up Node, bun and node_modules
description: >
  Node from .nvmrc, bun, and `bun install`. `npm ci` took 26 s at the median over 150 runs and ran
  once in every job; `bun install` takes about 5.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    # No download cache: bun fetches and links the whole tree from the registry in about 5 s, which
    # is less than restoring a cache of it would take.
    - run: bun install --frozen-lockfile
      shell: bash
